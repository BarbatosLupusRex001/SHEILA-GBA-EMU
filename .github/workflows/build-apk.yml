name: Build SHEILA GBA EMU APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SHEILA GBA EMU
        uses: actions/checkout@v4

      - name: Extract Project Zip (if uploaded as zip)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found zip file, extracting..."
            unzip -o *.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        run: |
          # Detect project directory
          if [ -f "android/settings.gradle.kts" ]; then
            cd android
          elif [ -f "android/build.gradle.kts" ]; then
            cd android
          fi

          echo "Running Gradle in $(pwd)"
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHEILA-GBA-EMU-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
