<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Rounded-square black background with soft rounded corners (80px radius on 512px) -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="94" ry="94" fill="none" stroke="#252a34" stroke-width="2"/>

  <!-- Centered White Wolf Head Silhouette (Stylized, Geometric, Modern Vector) -->
  <g transform="translate(256, 266) scale(0.92)" filter="url(#subtleGlow)">
    <!-- Right side of wolf head -->
    <path d="M 0 -150
             L 55 -85
             L 140 -120
             L 115 -20
             L 145 35
             L 100 55
             L 125 110
             L 75 115
             L 60 145
             L 25 130
             L 0 160
             L -25 130
             L -60 145
             L -75 115
             L -125 110
             L -100 55
             L -145 35
             L -115 -20
             L -140 -120
             L -55 -85
             Z"
          fill="#FFFFFF" />

    <!-- Wolf Eyes cutouts / inner facial definition in dark background tone -->
    <!-- Center forehead furrow -->
    <polygon points="0,-95 18,-45 0,-15 -18,-45" fill="#0c0e12"/>

    <!-- Left Eye & brow -->
    <polygon points="-32,-25 -65,-30 -42,-12 -28,-18" fill="#0c0e12"/>
    <polygon points="-45,-42 -22,-32 -30,-26 -55,-35" fill="#FFFFFF"/>

    <!-- Right Eye & brow -->
    <polygon points="32,-25 65,-30 42,-12 28,-18" fill="#0c0e12"/>
    <polygon points="45,-42 22,-32 30,-26 55,-35" fill="#FFFFFF"/>

    <!-- Muzzle cheek contours -->
    <polygon points="-24,0 -48,45 -22,35 -15,10" fill="#0c0e12"/>
    <polygon points="24,0 48,45 22,35 15,10" fill="#0c0e12"/>

    <!-- Snout & Nose bridge -->
    <polygon points="0,35 14,75 0,105 -14,75" fill="#0c0e12"/>
    <polygon points="0,85 10,75 0,65 -10,75" fill="#FFFFFF"/>

    <!-- Ear inner facets -->
    <polygon points="-75,-85 -115,-95 -95,-40" fill="#0c0e12"/>
    <polygon points="75,-85 115,-95 95,-40" fill="#0c0e12"/>
  </g>
</svg>
